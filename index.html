<html>
<head>
<title>Session 21</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="bg-secondary-subtle">
<div class="card text-bg-dark">
  <img src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg" class="card-img" alt="">
  <div class="card-img-overlay d-flex justify-content-center align-items-center">
    <h1 class="card-title">Viaan's Image Loader</h1>
  </div>
</div>

<div class="container text-center my-4">
<button class="btn btn-primary px-4 py-2" onclick="fetchImage()">Fetch Image Detail</button>
<div id="imageBox" class="my-4 d-flex justify-content-center align-items-center">
<h5>No image loaded</h5>
</div>
</div>

<script>
function fetchImage(){
    let imgBox = document.getElementById("imageBox");
    imgBox.innerHTML = "<h5>Loading Image</h5>";

    let imageUrl = "https://picsum.photos/600/350?random=" + Math.random();

    let img = document.createElement("img");
    img.src = imageUrl;

    img.onload = function(){
        imgBox.innerHTML = "";
        imgBox.appendChild(img);
    }

    img.onerror = function(){
        alert("Error Occured while fetching image detail")
    }
}

</script>
</body>
</html>
